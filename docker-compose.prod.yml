services:
  mail-reply-studio:
    build: .
    expose:
      - "3000"
    environment:
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:?Set APP_ACCESS_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PORT: 3000
    volumes:
      - mail_reply_data:/app/.mail-reply-data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - mail-reply-studio
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  mail_reply_data:
  caddy_data:
  caddy_config:
